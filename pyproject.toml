[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentgenome"
version = "0.1.0"
description = "Governed, version-pinned adaptive agent runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.135,<0.136", "uvicorn>=0.34,<1", "pydantic>=2.13,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0.49,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.15,<2", "temporalio>=1.10,<2",
  "mcp>=2,<3", "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "redis>=5,<7",
  "cryptography>=50,<51", "boto3>=1.37,<2", "PyYAML>=6,<7", "typer>=0.15,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6,<7",
       "aiosqlite>=0.21,<1", "ruff>=0.11,<1", "mypy>=1.15,<2",
       "types-PyYAML", "pip-audit>=2.8,<3"]

[tool.hatch.build.targets.wheel]
packages = ["packages/agentgenome", "apps", "workers"]

[project.scripts]
agentgenome = "agentgenome.cli:app"
agentgenome-mcp = "agentgenome.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Temporal"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentgenome", "apps", "workers"]
mypy_path = "packages"

[[tool.mypy.overrides]]
# AWS clients expose dynamic methods; domain and HTTP code remain strictly typed.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
