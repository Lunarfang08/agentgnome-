name: Packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    name: Build downloadable packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.11.17", python-version: "3.11", enable-cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", cache: npm }
      - run: uv sync --frozen
      - run: npm ci
      - run: make lint typecheck test build
      - name: Package TypeScript SDK
        run: npm pack --workspace sdk/typescript --pack-destination dist
      - name: Generate Python dependency SBOM
        run: uv run --no-sync pip-audit --progress-spinner off --format cyclonedx-json --output dist/python-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentgenome-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30
  containers:
    name: Container build / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: infrastructure/compose/Dockerfile
          - component: dashboard
            dockerfile: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build runtime image without publishing
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "agentgenome-$COMPONENT:check" .
