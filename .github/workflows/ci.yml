name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest tests/unit tests/security --junitxml=reports/python.xml
      - name: Fresh migration smoke test
        run: uv run --no-sync alembic upgrade head
        env:
          AG_DATABASE_URL: sqlite+aiosqlite:////tmp/agentgenome-migration.db
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: python-${{ matrix.python }}
          path: reports/
          retention-days: 7
  dashboard:
    name: Dashboard and SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck --workspace apps/dashboard
      - run: npm run typecheck --workspace sdk/typescript
      - run: npm run build --workspace apps/dashboard
      - run: npm run build --workspace sdk/typescript
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: local-postgres-admin }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 30
    env:
      AG_DATABASE_URL: postgresql+asyncpg://agentgenome:local-development@127.0.0.1:5432/agentgenome
      AG_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.11.17", python-version: "3.11", enable-cache: true }
      - run: uv sync --frozen
      - run: PGPASSWORD=local-postgres-admin psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f infrastructure/compose/init.sql
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync python scripts/seed.py
      - run: uv run --no-sync pytest tests/integration --junitxml=reports/postgres.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with: { name: postgres-results, path: reports/, retention-days: 7 }
  browser:
    name: Browser and durable recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.11.17", python-version: "3.11", enable-cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm }
      - run: python3 scripts/bootstrap.py
      - run: uv sync --frozen
      - run: npm ci
      - run: npm exec --workspace apps/dashboard -- playwright install --with-deps chromium
      - name: Start real local infrastructure
        run: docker compose -f infrastructure/compose/compose.yaml up -d --wait postgres redis temporal
      - run: make migrate seed-core
      - name: Start application processes
        shell: bash
        run: |
          mkdir -p reports
          .venv/bin/uvicorn apps.api.main:create_app --factory --host 127.0.0.1 --port 8080 > reports/api.log 2>&1 &
          .venv/bin/python -m workers.main > reports/worker.log 2>&1 &
          echo "$!" > reports/worker.pid
          npm run dev --workspace apps/dashboard > reports/dashboard.log 2>&1 &
          curl --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:8080/healthz
          curl --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:3000/healthz
      - run: make e2e e2e-ui mcp-config mcp-smoke
      - name: Verify crash after commit
        shell: bash
        run: |
          kill "$(cat reports/worker.pid)"
          make recovery
      - name: Capture service logs
        if: always()
        run: docker compose -f infrastructure/compose/compose.yaml logs --no-color > reports/services.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-and-recovery
          path: |
            reports/
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose -f infrastructure/compose/compose.yaml down
